# Run with shinka_run --task-dir examples/circle_packing
# --config-fname shinka_tournament.yaml --num_generations 20
max_evaluation_jobs: 1
max_proposal_jobs: 1
max_db_workers: 1
db:
  num_islands: 1
  archive_size: 40
  parent_selection_strategy: tournament
  tournament_top_k: 8
  tournament_num_draws: 3
  num_archive_inspirations: 0
  num_top_k_inspirations: 1
evo:
  max_api_costs: 1.5
  llm_models: [gpt-5-mini]
  llm_kwargs:
    temperatures: [0.0]
    reasoning_efforts: [low]
    max_tokens: 8192
  patch_types: [full]
  patch_type_probs: [1.0]
  embedding_model: null
  meta_rec_interval: null
job:
  time: "00:01:00"
  numeric_threads_per_job: 1
