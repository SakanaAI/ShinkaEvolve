name: PyPI Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(python - <<'PY'
          from pathlib import Path
          import re

          init_py = Path("shinka/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__ = "([^"]+)"', init_py, re.MULTILINE)
          if not match:
              raise SystemExit("Could not find __version__ in shinka/__init__.py")
          print(match.group(1))
          PY
          )"
          test "$TAG_VERSION" = "$PACKAGE_VERSION"

      - name: Build distributions
        run: uv run --with build python -m build

      - name: Check package metadata
        run: uv run --with twine twine check dist/*

      - name: Reject gitignored files in release artifacts
        run: uv run --with python-dotenv python -m shinka.release_check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
